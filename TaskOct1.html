// Question 1 — Create an asynchronous function named `welcomeUser()`. 
// The function should wait for **2 seconds** and then return the following message: ```text Welcome to JavaScript Async/Await! ``` 
// Call the function and display the returned message in the console.

// Solution:
  async function welcomeUser(){
    setTimeout(()=>{
      return console.log("Welcome to JavaScript Async/Await!")
    }, 2000)
  }
  welcomeUser()

// Question 3 — Get User Data: Create an asynchronous function named `getUser()`. Use a Promise to return the following user information

// Question 4 — Fetch Data from API: Create an asynchronous function that uses `fetch()` 
// to get users from: ```text https://jsonplaceholder.typicode.com/users ``` Requirements: - Use `async` - Use `await` - Convert the response
//  into JSON - Display the user data in the console

// Solution:
  async function getUsers() {
    await fetch("https://jsonplaceholder.typicode.com/users")
    .then(res => res.json())
    .then(data => console.log(data))
    .catch(err => console.log(err))
  }
  getUsers()

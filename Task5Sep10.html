<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    
      a = 3;
      b = -4;
      c = 0;
      largest = null;
      middle = null;
      small = null;

      if (a > b){ 
        if (a > c){ 
          largest = a; 
          if (b > c){ 
            middle = b;
            small = c;
          }
          else{
            middle = c;
            small = b;
          }
        }
        else{
          largest = c;
          middle = a;
          small = b;
        }
      }
      else{
          if(b > c){
            largest = b;
            if(c > a){
              middle = c;
              small = a;
            }
            else{
              middle = a;
              small = c;
            }
          }
          else{
            largest = c;
            middle = b;
            small = a;
          }
        }
      console.log(small + " " + middle + " " + largest);
  </script>
</body>
</html>

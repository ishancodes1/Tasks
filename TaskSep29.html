<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 29 September</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body h1 {
        text-align: center;
      }

      button {
        cursor: pointer;
        padding: 6px 12px;
        margin: 4px 2px;
      }

      /* same style for calculator, form, search, to-do*/
      .container,
      #listContainer {
        border: 5px solid rgb(255, 187, 0);
        background-color: rgba(255, 0, 0, 0.342);
        width: 420px;
        margin-top: 0;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 40px; 
        padding: 20px;
        border-radius: 12px;
      }

      .container h1,
      #listContainer h2 {
        margin-top: 0;
        font-size: 24px;
        text-align: left;
      }

      .container label {
        display: inline-block;
        width: 140px;
        margin-bottom: 4px;
      }

      /* Image slider */
      .imagesContainer {
        border: 5px solid black;
        width: 420px;
        height: 320px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .imagesContainer img {
        width: 400px;
        height: 300px;
      }

      .buttonsContainer {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 10px 0 40px;
      }

      /* To-do list */
      .taskCard {
        border: 3px solid rgb(255, 187, 0);
        background-color: rgba(0, 187, 255, 0.342);
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
      }

      /* Calculator */
      .calculatorContent {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 500px;
        margin: 0 0 40px;
        padding: 20px;
        background-color: rgb(170, 255, 0);
      }

      #calculatorDisplay {
        width: 301px;
        height: 75px;
        padding: 0 10px;
        text-align: right;
        font-family: monospace;
        font-size: 35px;
        font-weight: bold;
        border: 5px solid rgba(0, 183, 255, 0.507);
        background-color: rgb(0, 255, 72);
        border-radius: 5px;
        color: red;
      }

      .calculatorBtns {
        display: grid;
        grid-template-columns: repeat(4, 70px);
        grid-template-rows: repeat(5, 70px);
        gap: 4px;
        padding: 4px;
        background-color: blueviolet;
      }

      .calculatorBtns input {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: rgba(0, 183, 255, 0.507);
        border-radius: 5px;
        border: 2px solid rgb(0, 255, 72);
        color: white;
        font-weight: bold;
        font-size: 20px;
        cursor: pointer;
      }

      .calculatorBtns input:hover {
        background-color: rgb(255, 72, 0);
      }
    </style>
  </head>
  <body>
    <!-- Question 1 Solution -->
    <h1>Simple Calculator:</h1>
    <div class="container">
      <h1>Simple calculator</h1>
      <label for="num1">Number 1:</label>
      <input type="number" id="num1" /><br />
      <label for="num2">Number 2:</label>
      <input type="number" id="num2" /><br />
      <button onclick="add()">Add</button>
      <button onclick="subtract()">Subtract</button>
      <button onclick="multiply()">Multiply</button>
      <button onclick="divide()">Divide</button>
      <p id="result"></p>
    </div>


    <!-- Question 2 Solution -->
     <form class="container" onsubmit="valueChecker(event)">
      <h1>Value Type Checker</h1>
      <input type="text" id="enteredValue" required>
      <button>Check</button>
      <p id="valueTypeResult"></p>
     </form>


    <!-- Question 3 Solution -->
     <h1>Registration Form:</h1>
     <div class="container">
      <form onsubmit="checkPassword(event)">
       <label for="name">Name:</label>
       <input type="text" id="name" required><br><br>
       <label for="password">Password:</label>
       <input type="text" id="password" required><br><br>
       <label for="confirmPassword">Confirm Password:</label>
       <input type="text" id="confirmPassword" required><br><br>
       <button>Submit</button>
       <p id="passwordResult"></p>
      </form>
     </div>


     <!-- Question 5 Solution -->
      <h1>Image Slider:</h1>
      <div class="imagesContainer">
        <img src="images/football1.avif" id="slideImage">
      </div>
      <div class="buttonsContainer">
        <button onclick="changeImage(`previous`)">Previous</button>
        <button onclick="changeImage(`next`)">Next</button>
      </div>


      <!-- Question 6 Solution -->
       <!-- Calculator -->
    <h1>Calculator:</h1>
    <form class="calculatorContent">
      <input type="text" name="display" id="calculatorDisplay" />
      <div class="calculatorBtns">
        <input type="button" value="AC" onclick="display.value = ''" />
        <input
          type="button"
          value="DEL"
          onclick="display.value = display.value.slice(0, -1)"
        />
        <input type="button" value="%" onclick="display.value += value" />
        <input type="button" value="/" onclick="display.value += value" />
        <input type="button" value="7" onclick="display.value += value" />
        <input type="button" value="8" onclick="display.value += value" />
        <input type="button" value="9" onclick="display.value += value" />
        <input type="button" value="*" onclick="display.value += '*'" />
        <input type="button" value="4" onclick="display.value += value" />
        <input type="button" value="5" onclick="display.value += value" />
        <input type="button" value="6" onclick="display.value += value" />
        <input type="button" value="-" onclick="display.value += '-'" />
        <input type="button" value="1" onclick="display.value += value" />
        <input type="button" value="2" onclick="display.value += value" />
        <input type="button" value="3" onclick="display.value += value" />
        <input type="button" value="+" onclick="display.value += '+'" />
        <input type="button" value="00" onclick="display.value += value" />
        <input type="button" value="0" onclick="display.value += value" />
        <input type="button" value="." onclick="display.value += value" />
        <input
          type="button"
          value="="
          onclick="display.value = eval(display.value)"
        />
      </div>
    </form>


      <!-- Question 7 Solution -->
       <h1>YouTube Search Interface:</h1>
       <div class="container">
        <form onsubmit="redirectYoutube(event)">
        <input type="text" id="searchBar" placeholder="search..." required>
        <button>Search</button>
       </form>
       </div>


       <!-- Question 8 Solution: -->
        <h1>To Do List Maker:</h1>
        <div id="listContainer">
          <h2>To Do List</h2>
          <form onsubmit="addTask(event)">
            <input type="text" id="taskWritingInput" required>
            <button>Add</button>
          </form>
        </div>

        
    <script>
      // Qus 1. Create a simple calculator using HTML, CSS, and JavaScript. Add two input fields for taking two numbers as input.
      // Create four buttons — Add, Subtract, Multiply, and Divide. When the user clicks any button, perform the corresponding operation
      // on the two input values and display the result below the buttons.

      // solution:
      function add() {
        num1 = +document.getElementById("num1").value;
        num2 = +document.getElementById("num2").value;
        result = num1 + num2;
        document.getElementById("result").innerHTML = "Result: " + result;
      }
      function subtract() {
        num1 = +document.getElementById("num1").value;
        num2 = +document.getElementById("num2").value;
        result = num1 - num2;
        document.getElementById("result").innerHTML = "Result: " + result;
      }
      function multiply() {
        num1 = +document.getElementById("num1").value;
        num2 = +document.getElementById("num2").value;
        result = num1 * num2;
        document.getElementById("result").innerHTML = "Result: " + result;
      }
      function divide() {
        num1 = +document.getElementById("num1").value;
        num2 = +document.getElementById("num2").value;
        result = num1 / num2;
        document.getElementById("result").innerHTML = "Result: " + result;
      }


      // Qus 2. Create an input field where the user can enter any value. When the user clicks a button, check whether the entered 
      // value is a number or a string and display the result on the webpage
      function valueChecker(event){
        event.preventDefault();
        value = document.getElementById("enteredValue").value;
        if(+value == value){
          valueTypeResult.innerText = "Value is A Number";
        }
        else{
          valueTypeResult.innerText = "Value is A String";
        }
      }


      // Qus 3.Create a registration form with five input fields: Name, Password, and Confirm Password. Add a Submit button. 
      // When the user clicks the button, check whether the Password and Confirm Password values are the same or different.
      // Display an appropriate message such as “Password matched” or “Password does not match” on the webpage.

      function checkPassword(event){
        event.preventDefault();
        password = document.getElementById("password").value;
        confirmPassword = document.getElementById("confirmPassword").value;
        passwordResult = document.getElementById("passwordResult");
        if(password == confirmPassword){
          passwordResult.innerText = "Password matched";
        }
        else{
          passwordResult.innerText = "Password does not match";
        }
      }


      // Qus 5. Create an image slider using HTML, CSS, and JavaScript. Display one image at a time and 
      // add two buttons: “Previous” and “Next”. When the user clicks the Next button, show the next image, 
      // and when the user clicks the Previous button, show the previous image. The slider should be continuous,
      // meaning after the last image, clicking Next should show the first image again, and clicking Previous on
      // the first image should show the last image. 

      images = ["images/football1.avif",
                "images/football2.jpg",
                "images/basketBall1.jpeg",
                "images/basketBall2.jpeg",
                "images/baseball1.jpg",
                "images/baseball2.jpg"
      ]
      currentImage = 0;
      slideImage = document.getElementById("slideImage");
      function changeImage(prevOrNext) {
        if (prevOrNext == "next") {
          currentImage = (currentImage + 1) % images.length;
        } else {
          currentImage = (currentImage - 1 + images.length) % images.length;
        }
        slideImage.src = images[currentImage];
      }


      // qus 6. Create a fully functional calculator using HTML, CSS, and JavaScript.
      
      // Solution: inside html tag
      
      
      // Qus 7. Create a YouTube video search bar using HTML, CSS, and JavaScript. 
      // The search interface should contain: One input field where the user can enter a keyword. One Search button.

      // solution:
      function redirectYoutube(event){
        event.preventDefault();
        enteredQuery = document.getElementById("searchBar").value;
        encodedQuery = "https://www.youtube.com/results?search_query="+ encodeURIComponent(enteredQuery);
        window.location.href = encodedQuery;
      }


      // Qus 8. Create a fully functional To-Do List where users can Add, Edit, and Delete tasks.

      // solution:
      taskCounter = 0;
      function addTask(event){
        event.preventDefault();
        taskCounter++;
        taskElementId = `task${taskCounter}`;
        task = document.getElementById("taskWritingInput").value;
        listContainer = document.getElementById("listContainer");
        listContainer.innerHTML += `<div id=${taskElementId} class="taskCard">
                                    <p>${task}</p>
                                    <button onclick="deleteTask('${taskElementId}')">Delete</button>
                                    <button onclick="editTask('${taskElementId}')">Edit</button>
                                    </div>`;
      }

      function deleteTask(taskId){
        taskElement = document.getElementById(taskId);
        taskElement.remove();
      }

      function editTask(taskId){
        taskElement = document.getElementById(taskId);
        taskElement.innerHTML = `<form onsubmit="changeTask(event, '${taskId}')">
                                 <input type="text" placeholder="enter edited message..." id="editInput${taskId}" required>
                                 <button>Make Change</button>
                                 </form>`
      }

      function changeTask(event, taskId){
        event.preventDefault();
        taskElement = document.getElementById(taskId);
        editedMessage = document.getElementById(`editInput${taskId}`).value;
        taskElement.innerHTML = `<p>${editedMessage}</p>
                                 <button onclick="deleteTask('${taskId}')">Delete</button>
                                 <button onclick="editTask('${taskId}')">Edit</button>`;
      }
    </script>
  </body>
</html>
